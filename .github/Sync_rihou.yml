name: Sync Rihou TXT

on:
  schedule:
    # 建议与另外一个任务错开半小时执行，避免并发拥堵
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download NZK and Save as TXT
        run: |
          echo "开始尝试从源站拉取 nzk 文件..."
          
          # 直接在 -o 参数里将下载的文件强制命名为 gggg.txt
          if curl -k -L -f -s -S --connect-timeout 20 -m 120 --retry 5 --retry-delay 10 -o temp_gggg.txt "http://rihou.cc:555/gggg.nzk"; then
            
            FILE_SIZE=$(wc -c < temp_gggg.txt)
            # 同样校验文件大小，防止源站 502 时下载到假网页
            if [ "$FILE_SIZE" -gt 1000 ]; then
              mv temp_gggg.txt gggg.txt
              echo "下载并改名成功，文件大小 ($FILE_SIZE bytes)。"
            else
              echo "警告: 下载的文件过小 ($FILE_SIZE bytes)，疑似源站异常。本次放弃更新，保留原文件。"
              rm temp_gggg.txt
            fi
            
          else
            echo "警告: 源服务器完全无法访问或多次重试均超时。本次放弃更新，保留原文件。"
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gggg.txt
          git commit -m "Auto sync gggg.txt" || echo "No changes to commit"
          git push
