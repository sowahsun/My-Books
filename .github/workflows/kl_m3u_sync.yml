name: Sync KL_Live M3U

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download M3U File (With Fault Tolerance)
        id: dl
        run: |
          echo "开始尝试从源站下载..."
          
          if curl -k -L -f -s -S --connect-timeout 20 -m 120 --retry 5 --retry-delay 10 -o temp_lives.m3u "https://iptv.445569.xyz/live.m3u"; then
            FILE_SIZE=$(wc -c < temp_lives.m3u)
            if [ "$FILE_SIZE" -gt 1000 ]; then
              echo "下载成功 ($FILE_SIZE bytes)，准备进行黑名单过滤与排序..."
              echo "status=success" >> "$GITHUB_OUTPUT"
            else
              echo "警告: 下载的文件过小 ($FILE_SIZE bytes)，疑似源站异常。本次放弃更新，保留原文件。"
              rm -f temp_lives.m3u
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "警告: 源服务器完全无法访问或多次重试均超时。本次放弃更新，保留原文件。"
            rm -f temp_lives.m3u
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Process, Filter and Sort M3U
        if: steps.dl.outputs.status == 'success'
        shell: python
        run: |
          import os
          import re

          input_file = "temp_lives.m3u"
          output_file = "kl_lives.m3u"

          # ================= 配置区 =================
          # 统一使用小写，代码在比对时会自动忽略大小写
          black_categories = ["tiktok", "tg频道@stymei", "cloudflare直播"]
          # ==========================================

          # 智能排序权重：采用多词组合强力匹配，无视错别字和国旗符号
          def get_rank(cat_name):
              c = cat_name.replace(" ", "")
              if "1" in c and ("央卫" in c or "央视" in c): return 1
              if "2" in c and ("央卫" in c or "央视" in c): return 2
              if "地方台" in c: return 3
              if "港澳台" in c: return 4
              return 999

          try:
              with open(input_file, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              categories_dict = {}
              original_order = []
              current_extinf = None

              # 1. 遍历 M3U 文件，通过 group-title 归类频道
              for line in lines:
                  line_str = line.strip()
                  if not line_str or line_str.startswith("#EXTM3U"):
                      continue

                  if line_str.startswith("#EXTINF"):
                      current_extinf = line_str
                  elif not line_str.startswith("#") and current_extinf:
                      match = re.search(r'group-title="([^"]+)"', current_extinf, re.IGNORECASE)
                      group_title = match.group(1) if match else "未分类"

                      # 将分类名转为小写后进行黑名单拦截，彻底解决 CloudFlare 大小写漏网问题
                      lower_group_title = group_title.lower()
                      if not any(bc in lower_group_title for bc in black_categories):
                          if group_title not in original_order:
                              original_order.append(group_title)
                              categories_dict[group_title] = []
                          categories_dict[group_title].append((current_extinf, line_str))
                      
                      current_extinf = None

              # 2. 对分类进行自定义排序
              sorted_order = sorted(original_order, key=lambda x: (get_rank(x), original_order.index(x)))

              # 3. 拼装最终的 M3U 文本
              final_result = ["#EXTM3U"]
              for cat in sorted_order:
                  for extinf, url in categories_dict[cat]:
                      final_result.append(extinf)
                      final_result.append(url)

              if len(final_result) > 1:
                  with open(output_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(final_result))
                  print("M3U 黑名单过滤与分类排序完成。")
              
              os.remove(input_file)

          except Exception as e:
              print(f"处理数据时出错: {e}")
              if os.path.exists(input_file):
                  os.rename(input_file, output_file)

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kl_lives.m3u
          git commit -m "Auto sync kl_lives.m3u" || echo "No changes to commit"
          git push
