name: LXMusic - API Index Builder
on:
  schedule:
    - cron: '0 6 * * *' # UTC 6:00 = 北京时间 14:00
  workflow_dispatch:      # 允许手动执行

jobs:
  build_index:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 仅拉取本地当前最新配置，瞬间完成

      - name: Build LXMusic Index via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "🟠 [API] 正在隔空获取上游 guoyue2010/lxmusic- 的文件树..."
          curl -s --retry 3 --retry-delay 5 --max-time 60 \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/guoyue2010/lxmusic-/git/trees/main?recursive=1" > tree.json

          echo "🟠 [解析] 正在生成 lxmusic_list.json (无 README)..."
          cat << 'EOF' > build_index.py
          import json, urllib.parse, re
          from datetime import datetime

          with open('tree.json', 'r', encoding='utf-8') as f:
              tree_data = json.load(f)

          if 'tree' not in tree_data:
              print("❌ 获取 API 数据失败，请检查网络或上游仓库是否存在！")
              exit(1)

          # 兜底时间：以 Action 运行时间为准
          current_time = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          
          # 核心：目标直接指向原作者仓库的 Raw 链接
          raw_base = "https://raw.githubusercontent.com/guoyue2010/lxmusic-/main/"

          js_files = []

          for item in tree_data.get('tree', []):
              if item.get('type') != 'blob':
                  continue
              path = item['path']
              
              # 仅提取 .js 文件，排除 .github 等无关目录
              if not path.endswith('.js') or path.startswith('.github/'):
                  continue

              # 解析版本与分类 (适配 /版本/分类/名称.js 的结构)
              parts = path.split('/')
              name = parts[-1]
              
              if len(parts) >= 3:
                  version = parts[0]
                  category = parts[1]
              elif len(parts) == 2:
                  version = parts[0]
                  category = "根目录"
              else:
                  version = "根目录"
                  category = "根目录"

              # 💡 核心魔法：从类似 V260817 或 v260212 的目录名中提取真实发布日期！
              file_time = current_time
              match = re.search(r'^[Vv](\d{2})(\d{2})(\d{2})', version)
              if match:
                  # 拼装成标准的 YYYY-MM-DD HH:MM:SS 格式
                  file_time = f"20{match.group(1)}-{match.group(2)}-{match.group(3)} 00:00:00"

              # 自动对 URL 里的中文和空格进行安全编码
              safe_path = urllib.parse.quote(path)
              url = raw_base + safe_path
              size_bytes = item.get('size', 0)

              js_files.append({
                  'name': name,
                  'path': path,
                  'version': version,
                  'category': category,
                  'time': file_time,  # 写入提取出的真实时间
                  'size': size_bytes,
                  'url': url
              })

          with open('lxmusic_list.json', 'w', encoding='utf-8') as f:
              json.dump(js_files, f, ensure_ascii=False, indent=2)
          EOF

          python3 build_index.py
          rm -f tree.json build_index.py

          git add lxmusic_list.json
          
          # 只有当数据发生变化时才提交，避免无效的 commit 记录
          if git diff --cached --quiet; then
            echo "✅ 上游无变化，无需提交"
          else
            git commit -m "System: Secure API-based lxmusic index rebuild with real timestamps"
            git push origin main
          fi
