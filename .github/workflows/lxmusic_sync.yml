name: LXMusic - Pure JSON Extractor

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *" # 每天北京时间 14:00 (UTC 时间 6:00) 运行一次
  workflow_dispatch: # 允许手动点击触发

jobs:
  build_json:
    name: Extract JSON only
    runs-on: ubuntu-latest

    steps:
      # Step 1: 正常检出你的 My-Books 仓库
      - name: Checkout My-Books repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      # Step 2: 将上游仓库克隆到临时目录，只为获取最真实的 Git 提交时间
      - name: Clone Upstream (Temporary)
        run: |
          echo "🟠 正在克隆上游仓库到临时目录..."
          git clone https://github.com/guoyue2010/lxmusic-.git upstream_temp

      # Step 3: 扫描临时目录中的 JS，生成你的 lxmusic_list.json
      - name: Generate JSON
        run: |
          echo "🟠 正在扫描 JS 音源并提取真实物理时间..."
          cd upstream_temp
          rm -f ../js_files_raw.txt

          # 遍历所有 JS 文件获取时间和大小
          while IFS= read -r -d '' filepath; do
            if [[ "$filepath" == *.js ]] && [[ ! "$filepath" =~ ^\.github/ ]]; then
              committime=$(git log -1 --format=%ci -- "$filepath" 2>/dev/null || echo "")
              filesize=$(stat -c%s "$filepath" 2>/dev/null || echo "0")
              echo "$filepath|$committime|$filesize" >> ../js_files_raw.txt
            fi
          done < <(git ls-files -z)

          cd ..

          echo "🟠 正在格式化为 JSON 并替换直链..."
          # 利用 jq 处理，并将下载直链强行指向 guoyue2010
          if [ -f js_files_raw.txt ]; then
            cat js_files_raw.txt | jq -R -s -c '
              split("\n") | map(select(length > 0)) | map(split("|") | {
                name: (.[0] | split("/") | last),
                path: .[0],
                version: (.[0] | split("/")[0]),
                category: (.[0] | split("/")[1] // "根目录"),
                time: .[1],
                size: (.[2] | tonumber),
                url: ("https://raw.githubusercontent.com/guoyue2010/lxmusic-/main/" + (.[0] | split("/") | map(gsub(" "; "%20") | gsub("\\["; "%5B") | gsub("\\]"; "%5D") | gsub("\\("; "%28") | gsub("\\)"; "%29")) | join("/")))
              })
            ' > lxmusic_list.json
          else
            echo "[]" > lxmusic_list.json
          fi

          echo "✅ lxmusic_list.json 生成完毕！"
          
          # 清理战场，销毁临时仓库和缓存文件
          rm -rf upstream_temp js_files_raw.txt

      # Step 4: 仅提交 lxmusic_list.json 到你的 My-Books 仓库
      - name: Commit and Push
        run: |
          git add lxmusic_list.json
          if git diff --cached --quiet; then
            echo "✅ 数据无变化，无需提交"
          else
            git commit -m "Auto: Extract real timestamps & update lxmusic_list.json"
            git push origin main
            echo "✅ 已成功将最新的 json 列表推送到 My-Books"
          fi
