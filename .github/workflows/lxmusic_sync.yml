name: LXMusic - Pure JSON Extractor

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *" # 每天北京时间 14:00 (UTC 时间 6:00) 运行一次
  workflow_dispatch: # 允许手动点击触发

jobs:
  build_json:
    name: Extract JSON only
    runs-on: ubuntu-latest

    steps:
      # Step 1: 正常检出你的 My-Books 仓库
      - name: Checkout My-Books repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      # Step 2: 将上游仓库克隆到临时目录，只为获取最真实的 Git 提交时间
      - name: Clone Upstream (Temporary)
        run: |
          echo "🟠 正在克隆上游仓库到临时目录..."
          git clone https://github.com/guoyue2010/lxmusic-.git upstream_temp

      # Step 3: 扫描源生成 JSON（融合 Macrohard0001 Releases）
      - name: Generate JSON
        run: |
          echo "🟠 正在扫描 JS 音源并提取真实物理时间..."
          cd upstream_temp
          rm -f ../js_files_raw.txt

          # [原有逻辑保留] 遍历所有 JS 文件获取时间和大小，末尾增加标识 GUOYUE
          while IFS= read -r -d '' filepath; do
            if [[ "$filepath" == *.js ]] && [[ ! "$filepath" =~ ^\.github/ ]]; then
              committime=$(git log -1 --format=%ci -- "$filepath" 2>/dev/null || echo "")
              filesize=$(stat -c%s "$filepath" 2>/dev/null || echo "0")
              # 稍微修改：尾部加上 |GUOYUE 方便后续 jq 判断
              echo "$filepath|$committime|$filesize|GUOYUE" >> ../js_files_raw.txt
            fi
          done < <(git ls-files -z)

          cd ..

          echo "🟠 正在请求 Macrohard0001 最新 Release 获取未压缩 JS..."
          # [新增逻辑] 通过 API 获取最新 release 的 JS 文件
          release_json=$(curl -sL https://api.github.com/repos/Macrohard0001/lx-ikun-music-sources/releases/latest)
          
          # 提取 Release 的标签名作为版本/分类（例如：v260831_开学前的挣扎）
          tag_name=$(echo "$release_json" | jq -r '.tag_name // "unknown_version"')
          
          # 遍历 assets 中以 .js 结尾的文件
          echo "$release_json" | jq -c '.assets[]? | select(.name | endswith(".js"))' | while read -r asset; do
            asset_name=$(echo "$asset" | jq -r '.name')
            asset_time=$(echo "$asset" | jq -r '.updated_at') # 时间格式如 2024-08-31T...
            asset_size=$(echo "$asset" | jq -r '.size')
            asset_url=$(echo "$asset" | jq -r '.browser_download_url')
            
            # 为了契合你原有的分类逻辑 (split("/"))，我们构造一个虚拟路径
            # 格式：Macrohard0001 / 版本号 / 文件名.js
            mock_filepath="Macrohard0001/$tag_name/$asset_name"
            
            # 直接将下载直链写在第4个字段
            echo "$mock_filepath|$asset_time|$asset_size|$asset_url" >> js_files_raw.txt
          done

          echo "🟠 正在格式化为 JSON 并替换直链..."
          # [微调逻辑] 利用 jq 处理。增加判断：是 GUOYUE 就用原方式拼接，否则直接用第4个字段的直链
          if [ -f js_files_raw.txt ]; then
            cat js_files_raw.txt | jq -R -s -c '
              split("\n") | map(select(length > 0)) | map(split("|") | {
                name: (.[0] | split("/") | last),
                path: .[0],
                version: (.[0] | split("/")[0]),
                category: (.[0] | split("/")[1] // "根目录"),
                time: .[1],
                size: (.[2] | tonumber),
                url: (if .[3] == "GUOYUE" then ("https://raw.githubusercontent.com/guoyue2010/lxmusic-/main/" + (.[0] | split("/") | map(gsub(" "; "%20") | gsub("\\["; "%5B") | gsub("\\]"; "%5D") | gsub("\\("; "%28") | gsub("\\)"; "%29")) | join("/"))) else .[3] end)
              })
            ' > lxmusic_list.json
          else
            echo "[]" > lxmusic_list.json
          fi

          echo "✅ lxmusic_list.json 生成完毕！"
          
          # 清理战场，销毁临时仓库和缓存文件
          rm -rf upstream_temp js_files_raw.txt

      # Step 4: 仅提交 lxmusic_list.json 到你的 My-Books 仓库
      - name: Commit and Push
        run: |
          git add lxmusic_list.json
          if git diff --cached --quiet; then
            echo "✅ 数据无变化，无需提交"
          else
            git commit -m "Auto: Extract real timestamps & update lxmusic_list.json"
            git push origin main
            echo "✅ 已成功将最新的 json 列表推送到 My-Books"
          fi
