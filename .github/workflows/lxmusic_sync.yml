name: LXMusic - API Index Builder
on:
  schedule:
    - cron: '0 6 * * *' # UTC 6:00 = 北京时间 14:00
  workflow_dispatch:      # 允许手动执行

jobs:
  build_index:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build LXMusic Index via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "🟠 [API] 正在隔空获取上游 guoyue2010/lxmusic- 的文件树..."
          curl -s --retry 3 --retry-delay 5 --max-time 60 \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/guoyue2010/lxmusic-/git/trees/main?recursive=1" > tree.json

          echo "🟠 [解析] 正在生成 lxmusic_list.json (处理时间戳沉底)..."
          cat << 'EOF' > build_index.py
          import json, urllib.parse, re
          from datetime import datetime

          with open('tree.json', 'r', encoding='utf-8') as f:
              tree_data = json.load(f)

          if 'tree' not in tree_data:
              print("❌ 获取 API 数据失败，请检查网络或上游仓库是否存在！")
              exit(1)

          raw_base = "https://raw.githubusercontent.com/guoyue2010/lxmusic-/main/"
          js_files = []

          for item in tree_data.get('tree', []):
              if item.get('type') != 'blob':
                  continue
              path = item['path']
              
              if not path.endswith('.js') or path.startswith('.github/'):
                  continue

              parts = path.split('/')
              name = parts[-1]
              
              if len(parts) >= 3:
                  version = parts[0]
                  category = parts[1]
              elif len(parts) == 2:
                  version = parts[0]
                  category = "根目录"
              else:
                  version = "根目录"
                  category = "根目录"

              # 💡 核心魔法2.0：完美处理各种奇葩版本号
              file_time = "2000-01-01 00:00:00" # 默认给个远古时间，防止乱顶排名
              
              # 先尝试匹配 6 位数字 (如 V260817 -> 2026-08-17)
              match_full = re.search(r'^[Vv](\d{2})(\d{2})(\d{2})', version)
              # 再尝试匹配 4 位数字 (如 V2603 -> 2026-03-01)
              match_short = re.search(r'^[Vv](\d{2})(\d{2})', version)
              
              if match_full:
                  file_time = f"20{match_full.group(1)}-{match_full.group(2)}-{match_full.group(3)} 00:00:00"
              elif match_short:
                  file_time = f"20{match_short.group(1)}-{match_short.group(2)}-01 00:00:00"

              safe_path = urllib.parse.quote(path)
              url = raw_base + safe_path
              size_bytes = item.get('size', 0)

              js_files.append({
                  'name': name,
                  'path': path,
                  'version': version,
                  'category': category,
                  'time': file_time,
                  'size': size_bytes,
                  'url': url
              })

          with open('lxmusic_list.json', 'w', encoding='utf-8') as f:
              json.dump(js_files, f, ensure_ascii=False, indent=2)
          EOF

          python3 build_index.py
          rm -f tree.json build_index.py

          git add lxmusic_list.json
          
          if git diff --cached --quiet; then
            echo "✅ 上游无变化，无需提交"
          else
            git commit -m "System: Fix timestamp logic to prevent old files from floating to top"
            git push origin main
          fi
