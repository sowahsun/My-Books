name: Update lives_sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Process data sync
        shell: python
        run: |
          import urllib.request
          import re

          url = "https://raw.githubusercontent.com/fafa002/yf2025/refs/heads/main/yiyifafa.txt"
          output_file = "lives.txt"

          black_categories = ["易發", "私密", "JAV", "随机点播"]
          black_keywords = ["盗源", "全家", "Q群", "进群", "扫码", "打赏"]

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')

              lines = content.split('\n')
              result = []
              skip_current_category = False
              pattern = r'([^,]+?),((?:http|rtmp|rtsp|p2p|mitv|tvbus)\S+)'

              for line in lines:
                  line_str = line.strip()
                  if not line_str:
                      continue

                  text_to_check = line_str.split('http')[0].split('rtsp')[0]
                  if any(bk in text_to_check for bk in black_keywords):
                      continue

                  if ",#genre#" in line_str:
                      parts = line_str.split(',#genre#', 1)
                      category_name = parts[0].strip()

                      if any(bc in category_name for bc in black_categories):
                          skip_current_category = True
                      else:
                          skip_current_category = False
                          result.append(category_name + ",#genre#")
                      
                      if len(parts) > 1 and parts[1].strip() and not skip_current_category:
                          matches = re.findall(pattern, parts[1], flags=re.IGNORECASE)
                          for name, curl in matches:
                              result.append(f"{name.strip()},{curl.strip()}")
                      continue

                  if skip_current_category:
                      continue

                  if "," in line_str:
                      matches = re.findall(pattern, line_str, flags=re.IGNORECASE)
                      for name, curl in matches:
                          result.append(f"{name.strip()},{curl.strip()}")

              final_result = []
              for i in range(len(result)):
                  is_genre = ",#genre#" in result[i]
                  if is_genre and (i == len(result) - 1 or ",#genre#" in result[i+1]):
                      continue
                  final_result.append(result[i])

              if final_result:
                  with open(output_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(final_result))
                  print(f"Sync success, saved as {output_file}")
          except Exception as e:
              print(f"Process failed: {e}")

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lives.txt
          git commit -m "Update lives.txt" || echo "No changes to commit"
          git push
