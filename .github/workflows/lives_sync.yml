name: Update lives_sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Process data sync
        shell: python
        run: |
          import urllib.request
          import re

          url = "https://raw.githubusercontent.com/fafa002/yf2025/refs/heads/main/yiyifafa.txt"
          output_file = "lives.txt"

          black_categories = ["易發", "私密", "JAV", "随机点播"]
          black_keywords = ["盗源", "全家", "Q群", "进群", "扫码", "打赏"]

          # 定义排序权重函数（自适应处理中英文括号及空格）
          def get_rank(cat_name):
              # 剔除所有空格，并将中文括号统一替换为英文括号
              c = cat_name.replace(" ", "").replace("（", "(").replace("）", ")")
              # 精准匹配关键字
              if "广东移动" in c and "内网" in c: return 1
              if "广东电信" in c and "内网" in c: return 2
              if "广东联通" in c and "内网" in c: return 3
              if "极速港台" in c and "挂梯" in c: return 4
              return 999

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')

              lines = content.split('\n')
              
              categories_dict = {}
              original_order = []
              current_cat = None
              pattern = r'([^,]+?),((?:http|rtmp|rtsp|p2p|mitv|tvbus)\S+)'

              # 1. 遍历读取，将频道按分类装入字典
              for line in lines:
                  line_str = line.strip()
                  if not line_str:
                      continue

                  text_to_check = line_str.split('http')[0].split('rtsp')[0]
                  if any(bk in text_to_check for bk in black_keywords):
                      continue

                  if ",#genre#" in line_str:
                      parts = line_str.split(',#genre#', 1)
                      category_name = parts[0].strip()

                      if any(bc in category_name for bc in black_categories):
                          current_cat = None
                      else:
                          current_cat = category_name
                          if current_cat not in original_order:
                              original_order.append(current_cat)
                              categories_dict[current_cat] = []
                      
                      # 抢救跟在 #genre# 同一行的频道数据
                      if len(parts) > 1 and parts[1].strip() and current_cat is not None:
                          matches = re.findall(pattern, parts[1], flags=re.IGNORECASE)
                          for name, curl in matches:
                              categories_dict[current_cat].append(f"{name.strip()},{curl.strip()}")
                      continue

                  if current_cat is None:
                      continue

                  # 3. 处理正常的频道行
                  if "," in line_str:
                      matches = re.findall(pattern, line_str, flags=re.IGNORECASE)
                      for name, curl in matches:
                          categories_dict[current_cat].append(f"{name.strip()},{curl.strip()}")

              # 2. 对分类进行自定义排序
              # key=(优先级, 原始索引)，确保指定分类置顶，其余分类保持上游原有顺序
              sorted_order = sorted(original_order, key=lambda x: (get_rank(x), original_order.index(x)))

              # 3. 拼装为最终的 M3U/TXT 格式，并自动清理空分类
              final_result = []
              for cat in sorted_order:
                  channels = categories_dict.get(cat, [])
                  if len(channels) > 0:
                      final_result.append(f"{cat},#genre#")
                      final_result.extend(channels)

              if final_result:
                  with open(output_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(final_result))
                  print(f"Sync success, saved as {output_file}")
          except Exception as e:
              print(f"Process failed: {e}")

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lives.txt
          git commit -m "Update lives.txt" || echo "No changes to commit"
          git push
