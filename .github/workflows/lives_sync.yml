name: Update lives_sync

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Process data sync
        run: |
          cat << 'EOF' > sync.py
          import urllib.request
          
          url = "https://raw.githubusercontent.com/fafa002/yf2025/refs/heads/main/yiyifafa.txt"
          output_file = "lives.txt"
          
          # 1. 分类黑名单：杀掉各类色情、广告引流分类
          black_categories = ["易發", "私密", "JAV", "随机点播"]
          
          # 2. 关键字黑名单：杀掉频道名里的牛皮癣广告
          black_keywords = ["盗源", "si全家", "全家下地狱", "QQ群", "扫码进群", "永久免费", "换安卓", "打赏"]
          
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              lines = content.split('\n')
              result = []
              skip_current_category = False
              
              for line in lines:
                  line_str = line.strip()
                  if not line_str:
                      continue
                  
                  # 核心修复 1：处理分类行，强制剥离原作者加的 ",DE=3" 这种干扰尾巴
                  if ",#genre#" in line_str:
                      category_name = line_str.split(',#genre#')[0].strip()
                      
                      if any(bc in category_name for bc in black_categories):
                          skip_current_category = True
                      else:
                          skip_current_category = False
                          # 重新输出为最标准纯净的 TVBox 分类格式
                          result.append(category_name + ",#genre#")
                      continue
                  
                  if skip_current_category:
                      continue
                      
                  if any(bk in line_str for bk in black_keywords):
                      continue
                      
                  # 核心修复 2：过滤没有有效直播源的公告假频道（例如 "请勿打赏,1"）
                  if "," in line_str:
                      parts = line_str.split(',', 1)
                      if len(parts) == 2:
                          channel_url = parts[1].strip()
                          # 正常的直播流必然以这些主流协议开头
                          valid_prefixes = ("http", "rtmp", "rtsp", "p2p", "mitv", "tvbus")
                          if not channel_url.lower().startswith(valid_prefixes):
                              continue
                              
                  result.append(line_str)
                  
              if result:
                  with open(output_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(result))
                  print(f"Sync success, saved as {output_file}")
          except Exception as e:
              print(f"Process failed: {e}")
          EOF
          
          python3 sync.py
          rm sync.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lives.txt
          git commit -m "Update lives.txt" || echo "No changes to commit"
          git push
