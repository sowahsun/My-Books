name: Sync Custom Lives M3U

on:
  schedule:
    - cron: '45 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download M3U File (With Fault Tolerance)
        id: dl
        run: |
          echo "开始尝试从源站拉取 m3u 文件..."
          
          if curl -k -L -f -s -S --connect-timeout 20 -m 120 --retry 5 --retry-delay 10 -o temp_custom_lives.m3u "https://lytvs.top/py/custom_lives.m3u"; then
            FILE_SIZE=$(wc -c < temp_custom_lives.m3u)
            if [ "$FILE_SIZE" -gt 1000 ]; then
              echo "下载并覆盖成功，文件大小 ($FILE_SIZE bytes)。"
              echo "status=success" >> "$GITHUB_OUTPUT"
            else
              echo "警告: 下载的文件过小 ($FILE_SIZE bytes)，疑似源站异常。本次放弃更新，保留原文件。"
              rm -f temp_custom_lives.m3u
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "警告: 源服务器完全无法访问或多次重试均超时。本次放弃更新，保留原文件。"
            rm -f temp_custom_lives.m3u
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Process and Natural Sort Channels
        if: steps.dl.outputs.status == 'success'
        shell: python
        run: |
          import os
          import re

          input_file = "temp_custom_lives.m3u"
          output_file = "custom_lives.m3u"

          # 核心规则：自然排序键提取函数
          def natural_sort_key(item):
              extinf = item[0]
              # 修正点：将 "-" 去掉，使得 "CCTV-1" 变成 "CCTV1"，从而其文字部分 "cctv" 优先于 "cctv+"
              clean_name = extinf.replace("-", "")
              return [int(text) if text.isdigit() else text.lower() for text in re.split(r'(\d+)', clean_name)]

          try:
              with open(input_file, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              categories_dict = {}
              original_order = []
              current_extinf = None

              for line in lines:
                  line_str = line.strip()
                  if not line_str or line_str.startswith("#EXTM3U"):
                      continue

                  if line_str.startswith("#EXTINF"):
                      current_extinf = line_str
                  elif not line_str.startswith("#") and current_extinf:
                      match = re.search(r'group-title="([^"]+)"', current_extinf, re.IGNORECASE)
                      group_title = match.group(1) if match else "未分类"

                      # 严格保持源文件原本的分类顺序，不做人为置顶或过滤
                      if group_title not in original_order:
                          original_order.append(group_title)
                          categories_dict[group_title] = []
                      
                      categories_dict[group_title].append((current_extinf, line_str))
                      current_extinf = None

              # 拼装最终结果：保持分类顺序不变，仅对分类内部的频道执行修正后的自然排序
              final_result = ["#EXTM3U"]
              for cat in original_order:
                  sorted_channels = sorted(categories_dict[cat], key=natural_sort_key)
                  for extinf, url in sorted_channels:
                      final_result.append(extinf)
                      final_result.append(url)

              if len(final_result) > 1:
                  with open(output_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(final_result))
                  print("M3U 频道内部自然排序完成。")
              
              os.remove(input_file)

          except Exception as e:
              print(f"处理数据时出错: {e}")
              if os.path.exists(input_file):
                  os.rename(input_file, output_file)

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add custom_lives.m3u
          git commit -m "Auto sync custom_lives.m3u" || echo "No changes to commit"
          git push
