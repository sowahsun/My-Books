name: LXMusic - New Metadata Index Builder
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build_new_index:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build LXMusic New Index via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          curl -s --retry 3 --retry-delay 5 --max-time 60 \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/guoyue2010/lxmusic-/git/trees/main?recursive=1" > tree.json

          cat << 'EOF' > build_new_index.py
          import json, urllib.parse, re
          from datetime import datetime

          def extract_version_from_filename(filename):
              m = re.search(r'(?:v|V)?(\d+(?:\.\d+)+)', filename)
              if m:
                  return m.group(1)
              m = re.search(r'(?:v|V)(\d{1,4})\b', filename)
              if m:
                  return m.group(1)
              return ''

          def extract_date_from_string(s):
              # 完整日期 YYYY-MM-DD / YYYYMMDD
              m = re.search(r'(20\d{2})[-_]?(\d{2})[-_]?(\d{2})', s)
              if m:
                  return f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
              # 短日期 v260716 -> 2026-07-16；v2603 -> 2026-03-01
              m = re.search(r'(?:v|V)?(\d{2})(\d{2})(\d{2})?', s)
              if m:
                  year = int(m.group(1))
                  full_year = 2000 + year if year < 80 else 1900 + year
                  month = m.group(2)
                  day = m.group(3) if m.group(3) else '01'
                  return f"{full_year}-{month}-{day}"
              return ''

          def normalize_source_key(filename):
              base = filename[:-3] if filename.endswith('.js') else filename
              base = re.sub(r'[\(\（\[].*?[\)\）\]]', ' ', base)
              base = re.sub(r'[^\u4e00-\u9fa5a-zA-Z0-9]+', ' ', base)
              base = re.sub(r'(?<![a-zA-Z0-9])(?:[vV])?\d+(?:\.\d+)*(?![a-zA-Z0-9])', ' ', base)
              base = re.sub(r'\b\d{2,8}\b', ' ', base)
              base = re.sub(r'\b[a-zA-Z]\b', ' ', base)

              # 噪声词列表（先长后短，确保彻底移除修饰性词汇）
              noise_words = [
                  'TSS解密版', '特供版', 'DeepSeek优化', '修复部分问题', '兼容性处理',
                  '修复版本', '并', '版本', '优化', '修复', '测试', 'beta',
                  '公益测试', '即将恢复', '仅支持网易', '需自备网易云VIP密钥',
                  '酷狗挂了', '会停用', '已停用', '需自行配置', '不推荐', '未测试',
                  '自备', '密钥', '密码', '挂', '挂了', '恢复',
                  '支持', '无损', '全平台', '平台', '部分', '问题', '兼容', '处理'
              ]
              for word in noise_words:
                  base = base.replace(word, ' ')

              base = re.sub(r'\s+', ' ', base).strip()
              if not base:
                  base = filename[:-3] if filename.endswith('.js') else filename
              return base

          def check_active(filename):
              bad_words = [
                  '停用', '需自行配置', '需自备', '需自带', '密码', '密钥',
                  '失效', '测试', '无效', '废弃', '暂停', '已停用', '会停用',
                  '恢复', '挂', '挂了', '不推荐', '未测试', '自备',
                  '酷狗挂了', '即将恢复', '仅支持网易', '需自备网易云VIP密钥'
              ]
              return not any(word in filename for word in bad_words)

          with open('tree.json', 'r', encoding='utf-8') as f:
              tree_data = json.load(f)

          if 'tree' not in tree_data:
              print("❌ 获取 API 数据失败")
              exit(1)

          current_time = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          raw_base = "https://raw.githubusercontent.com/guoyue2010/lxmusic-/main/"
          js_files = []

          for item in tree_data.get('tree', []):
              if item.get('type') != 'blob':
                  continue
              path = item['path']
              if not path.endswith('.js') or path.startswith('.github/'):
                  continue

              parts = path.split('/')
              name = parts[-1]
              if len(parts) >= 3:
                  folder_version = parts[0]
                  folder_category = parts[1]
              elif len(parts) == 2:
                  folder_version = parts[0]
                  folder_category = "根目录"
              else:
                  folder_version = "根目录"
                  folder_category = "根目录"

              version_clean = extract_version_from_filename(name)
              source_key = normalize_source_key(name)
              is_active = check_active(name)

              # 优先从第一级目录提取日期（如 V260716）
              file_date = extract_date_from_string(parts[0]) if parts else ''
              if not file_date:
                  file_date = extract_date_from_string(path) or extract_date_from_string(name)

              safe_path = urllib.parse.quote(path)
              url = raw_base + safe_path
              size_bytes = item.get('size', 0)

              js_files.append({
                  'name': name,
                  'path': path,
                  'version': folder_version,
                  'category': folder_category,
                  'time': current_time,
                  'size': size_bytes,
                  'url': url,
                  'source_key': source_key,
                  'version_clean': version_clean,
                  'is_active': is_active,
                  'file_date': file_date
              })

          with open('lx_new_list.json', 'w', encoding='utf-8') as f:
              json.dump(js_files, f, ensure_ascii=False, indent=2)
          EOF

          python3 build_new_index.py
          rm -f tree.json build_new_index.py

          git add lx_new_list.json
          if git diff --cached --quiet; then
            echo "✅ 上游无变化，无需提交"
          else
            git commit -m "System: Improved source_key normalization and date extraction"
            git push origin main
          fi
