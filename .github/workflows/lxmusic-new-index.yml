name: LXMusic - API Index Builder (New Metadata)
on:
  schedule:
    - cron: '0 6 * * *' # UTC 6:00 = 北京时间 14:00
  workflow_dispatch:      # 允许手动执行

jobs:
  build_index:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 仅拉取本地当前最新配置，瞬间完成

      - name: Build LXMusic Index via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "🟠 [API] 正在隔空获取上游 guoyue2010/lxmusic- 的文件树..."
          curl -s --retry 3 --retry-delay 5 --max-time 60 \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/guoyue2010/lxmusic-/git/trees/main?recursive=1" > tree.json

          echo "🟠 [解析] 正在生成 lx_new_list.json (含 source_key / version_clean / is_active)..."
          cat << 'EOF' > build_new_index.py
          import json, urllib.parse, re
          from datetime import datetime

          # ---------- 优化工具函数 ----------
          def extract_version_from_filename(filename):
              """
              提取版本号，支持：
                - v1.0.1 / V1.0.1 -> 1.0.1
                - V4 / v4           -> 4
                - V2603 / v2603     -> 2603
              """
              # 1. 尝试匹配带点版本：v1.0.1, V9.7
              m = re.search(r'(?:v|V)?(\d+(?:\.\d+)+)', filename)
              if m:
                  return m.group(1)
              # 2. 匹配 V 后跟 1-4 位数字（无点）：V4, V2603, v42
              m = re.search(r'(?:v|V)(\d{1,4})\b', filename)
              if m:
                  return m.group(1)
              return ''

          def extract_date_from_string(s):
              """
              提取日期，支持：
                - 2026-07-16 / 2026_07_16 / 20260716
                - V2607 (年份后两位+月份) -> 2026-07-01
                - V260716 -> 2026-07-16
              """
              # 完整日期
              m = re.search(r'(20\d{2})[-_]?(\d{2})[-_]?(\d{2})', s)
              if m:
                  return f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
              # 短日期：V2607 或 2607 或 V260716 等
              m = re.search(r'(?:v|V)?(\d{2})(\d{2})(?:\d{2})?', s)
              if m:
                  year = int(m.group(1))
                  full_year = 2000 + year if year < 80 else 1900 + year
                  month = m.group(2)
                  return f"{full_year}-{month}-01"
              return ''

          def normalize_source_key(filename):
              """
              从文件名提取核心源标识，彻底移除版本、日期、数字及符号。
              """
              base = filename[:-3] if filename.endswith('.js') else filename
              # 去掉括号及内部内容
              base = re.sub(r'[\(\（].*?[\)\）]', ' ', base)
              # 将所有非中文、非字母数字的字符（包括~、_、-、.等）替换为空格
              base = re.sub(r'[^\u4e00-\u9fa5a-zA-Z0-9]+', ' ', base)
              # 移除版本标记（带点或无点）
              base = re.sub(r'\b(?:v|V)?\d+(?:\.\d+)*\b', ' ', base)
              # 移除纯数字和日期模式（如 2026、2607 等）
              base = re.sub(r'\b\d{2,8}\b', ' ', base)
              # 移除残留的孤立字母（如版本移除后剩的 V）
              base = re.sub(r'\b[a-zA-Z]\b', ' ', base)
              # 合并空格
              base = re.sub(r'\s+', ' ', base).strip()
              # 如果结果为空，回退到原文件名（去扩展名）
              if not base:
                  base = filename[:-3] if filename.endswith('.js') else filename
              return base

          def check_active(filename):
              """根据文件名判断源是否可用，返回布尔值"""
              bad_words = ['停用', '需自行配置', '失效', '测试', '无效', '废弃', '暂停']
              return not any(word in filename for word in bad_words)

          # ---------- 主逻辑（保留原版结构） ----------
          with open('tree.json', 'r', encoding='utf-8') as f:
              tree_data = json.load(f)

          if 'tree' not in tree_data:
              print("❌ 获取 API 数据失败，请检查网络或上游仓库是否存在！")
              exit(1)

          current_time = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          raw_base = "https://raw.githubusercontent.com/guoyue2010/lxmusic-/main/"

          js_files = []

          for item in tree_data.get('tree', []):
              if item.get('type') != 'blob':
                  continue
              path = item['path']
              if not path.endswith('.js') or path.startswith('.github/'):
                  continue

              parts = path.split('/')
              name = parts[-1]

              # 目录结构解析（与原版一致）
              if len(parts) >= 3:
                  folder_version = parts[0]
                  folder_category = parts[1]
              elif len(parts) == 2:
                  folder_version = parts[0]
                  folder_category = "根目录"
              else:
                  folder_version = "根目录"
                  folder_category = "根目录"

              # 提取元数据
              version_clean = extract_version_from_filename(name)
              source_key = normalize_source_key(name)
              is_active = check_active(name)
              file_date = extract_date_from_string(path) or extract_date_from_string(name)

              safe_path = urllib.parse.quote(path)
              url = raw_base + safe_path
              size_bytes = item.get('size', 0)

              js_files.append({
                  'name': name,
                  'path': path,
                  'version': folder_version,          # 保留目录中的版本标识
                  'category': folder_category,        # 保留目录中的分类
                  'time': current_time,               # 索引生成时间
                  'size': size_bytes,
                  'url': url,
                  'source_key': source_key,           # 核心源标识
                  'version_clean': version_clean,     # 标准版本号
                  'is_active': is_active,             # 是否可用
                  'file_date': file_date              # 从路径/文件名提取的日期（可能为空）
              })

          with open('lx_new_list.json', 'w', encoding='utf-8') as f:
              json.dump(js_files, f, ensure_ascii=False, indent=2)
          EOF

          python3 build_new_index.py
          rm -f tree.json build_new_index.py

          git add lx_new_list.json
          
          # 只有当数据发生变化时才提交，避免无效的 commit 记录
          if git diff --cached --quiet; then
            echo "✅ 上游无变化，无需提交"
          else
            git commit -m "System: New index with source_key/version_clean/is_active"
            git push origin main
          fi
