name: N9G9 - Dual Engine Index Builder
on:
  schedule:
    - cron: '0 0 * * *' # UTC 0:00 = 北京时间 8:00
  workflow_dispatch:

jobs:
  build_apk_index:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Dual Format JSON via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "🟠 [解析] 正在隔空抓取数据，准备生成双版本 JSON..."
          cat << 'EOF' > build_apk_index.py
          import urllib.request, urllib.parse, json, re, os
          from datetime import datetime

          token = os.environ.get('GH_TOKEN')
          headers = {'Authorization': f'token {token}'} if token else {}

          def fetch_api(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode('utf-8'))
              except Exception as e:
                  print(f"❌ API 请求失败 {url}: {e}")
                  return None

          def fetch_raw(url):
              try:
                  with urllib.request.urlopen(url) as response:
                      return response.read().decode('utf-8')
              except:
                  return ""

          # 准备两个容器分别装旧版和新版的数据
          old_list = []
          new_php_list = []
          current_time = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          # ==========================================
          # 1. 提取独立源 Releases (包含 fmapp 和 webhtv)
          # ==========================================
          # 💡 在这里添加多个目标仓库，自动分配专属子文件夹
          release_targets = [
              {"repo": "lystv/fmapp", "folder": "fmapp"},
              {"repo": "fish2018/webhtv", "folder": "webhometv"}
          ]

          for target in release_targets:
              print(f"-> 提取 {target['repo']} Releases...")
              api_url = f"https://api.github.com/repos/{target['repo']}/releases"
              release_api = fetch_api(api_url)
              
              if release_api:
                  for release in release_api[:3]: # 每个仓库取最新的 3 个版本
                      for asset in release.get('assets', []):
                          if asset['name'].endswith('.apk'):
                              time_str = asset['updated_at'].replace('T', ' ').replace('Z', '')
                              raw_url = asset['browser_download_url']
                              
                              # 【旧版 HTML 格式】
                              old_list.append({
                                  "name": f"[{release['tag_name']}] {asset['name']}",
                                  "type": "release_asset",
                                  "path": f"Releases/{target['folder']}/{release['tag_name']}/{asset['name']}", 
                                  "time": time_str,
                                  "url": raw_url
                              })
                              
                              # 【新版 PHP 格式】
                              new_php_list.append({
                                  "name": asset['name'],
                                  "path": f"FMApp专属/{target['folder']}/{release['tag_name']}/{asset['name']}",
                                  "version": release['tag_name'],
                                  "category": "FMApp", # 保持 FMApp 分类以触发前端高亮和图标
                                  "time": time_str,
                                  "size": asset.get('size', 0),
                                  "url": raw_url 
                              })

          # ==========================================
          # 2. 提取 TVAPP 描述并生成单独的 desc_map
          # ==========================================
          print("-> 提取 youhunwl/TVAPP 描述信息...")
          readme_text = fetch_raw("https://raw.githubusercontent.com/youhunwl/TVAPP/main/README.md")
          desc_map = {}
          if readme_text:
              for line in readme_text.splitlines():
                  if line.startswith('|') and 'APP名称' not in line and '---' not in line:
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 6:
                          name = parts[1]
                          remark = parts[5]
                          name = re.sub(r'\[(.*?)\]\(.*?\)', r'\1', name)
                          name = name.replace('**', '').strip()
                          if name and remark:
                              desc_map[name] = remark

          # ==========================================
          # 3. 隔空获取 TVAPP 文件树
          # ==========================================
          print("-> 抓取 youhunwl/TVAPP 完整文件树...")
          tvapp_tree = fetch_api("https://api.github.com/repos/youhunwl/TVAPP/git/trees/main?recursive=1")
          if tvapp_tree and 'tree' in tvapp_tree:
              desc_keys = sorted(desc_map.keys(), key=len, reverse=True)
              for item in tvapp_tree['tree']:
                  path = item['path']
                  if path.endswith('.apk') and not path.startswith('.github/') and not path.startswith('wiki/'):
                      filename = path.split('/')[-1]
                      safe_path = urllib.parse.quote(path)
                      file_url = f"https://raw.githubusercontent.com/youhunwl/TVAPP/main/{safe_path}"

                      # 【旧版 HTML 格式】
                      old_list.append({
                          "name": filename,
                          "type": "repo_file",
                          "path": path, 
                          "time": current_time, 
                          "url": file_url
                      })
                      
                      # 【新版 PHP 格式】(带后缀描述和独立大分类)
                      app_desc = ""
                      for key in desc_keys:
                          if key in filename:
                              app_desc = f" 💡[{desc_map[key]}]"
                              break
                      category = path.split('/')[0] if '/' in path else "根目录"
                      
                      new_php_list.append({
                          "name": filename + app_desc,
                          "path": f"TVAPP影视库/{path}",
                          "version": "最新",
                          "category": category,
                          "time": current_time, 
                          "size": item.get('size', 0),
                          "url": file_url
                      })

          # ==========================================
          # 4. 并发写入三种 JSON 文件
          # ==========================================
          # 给旧项目用的
          with open('apk_list.json', 'w', encoding='utf-8') as f:
              json.dump(old_list, f, ensure_ascii=False, indent=2)
          with open('apk_desc.json', 'w', encoding='utf-8') as f:
              json.dump(desc_map, f, ensure_ascii=False, indent=2)
              
          # 给新 PHP 项目用的
          with open('apk_list_php.json', 'w', encoding='utf-8') as f:
              json.dump(new_php_list, f, ensure_ascii=False, indent=2)
              
          print(f"✅ 成功生成多版本索引！老版共 {len(old_list)} 条，新版共 {len(new_php_list)} 条。")
          EOF

          python3 build_apk_index.py
          rm -f build_apk_index.py

          # 一并提交所有的清单文件
          git add apk_list.json apk_desc.json apk_list_php.json
          if git diff --cached --quiet; then
            echo "✅ 数据无变化，无需提交"
          else
            git commit -m "System: Add WebHTV and generate dual-engine APK indexes"
            git push origin main
          fi
